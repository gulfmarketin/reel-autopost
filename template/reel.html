<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#12060a}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Data-driven reel template.
   Python calls setup({hook, payoff, index, handle}) then render(t) per frame.
   setup() returns {total, events:[[time,'whoosh'|'tick'|'pop'], ...]} so SFX line up with the visuals. */
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1080, H = 1920;
const GOLD = '#e9bd72', PINK = '#f3cfd6', RED = '#e0506a';
const SERIF = 'Lora, "Liberation Serif", Georgia, serif', SANS = 'Inter, "DejaVu Sans", sans-serif';
const HIGHLIGHT = /^(halal|haram|sunnah|prophet|islam|islamic|muslim|quran|qur'an|allah|#\d+|\d+[\w-]*|wife|husband|spouse|marriage|nikah|secret|truth|mistake|never|stop)$/i;

const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const ease = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2; };
const lerp = (a, b, t) => a + (b - a) * t;
function glow(c, b) { X.shadowColor = c; X.shadowBlur = b; }

let seed = 1, STARS = [], S = null;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function stripEmoji(s) {
  return s.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
}
function wrap(str, font, maxW) {
  X.font = font; const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (X.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur); return lines;
}

window.setup = function (d) {
  seed = 7 + (d.index || 0) * 131;
  STARS = Array.from({length: 140}, () => ({x: rnd()*W, y: rnd()*H, r: rnd()*1.6+0.4, ph: rnd()*6.28, sp: rnd()*1.5+0.5}));
  const hook = stripEmoji(d.hook), payoff = stripEmoji(d.payoff || '');
  let hs = 68, hookFont, hookLines;
  do { hookFont = `500 ${hs}px ${SERIF}`; hookLines = wrap(hook, hookFont, 900); hs -= 4; } while (hookLines.length > 6 && hs > 44);
  const ps = 62, payFont = `italic 500 ${ps}px ${SERIF}`, payLines = wrap(payoff, payFont, 880);
  const words = hook.split(' ').length;
  const lineGap = 0.42, revealStart = 0.35;
  const hookEnd = revealStart + hookLines.length * lineGap + Math.max(2.2, words * 0.27);
  const payStart = hookEnd + 0.35, total = payStart + 3.6;
  const events = [[0, 'whoosh']];
  hookLines.forEach((_, i) => events.push([revealStart + i * lineGap, 'tick']));
  events.push([hookEnd - 0.2, 'whoosh'], [payStart, 'pop'], [payStart + 0.9, 'tick'], [payStart + 1.9, 'tick']);
  S = { hook, payoff, hookLines, hookFont, hs: hs + 4, payLines, payFont, ps, hookEnd, payStart, total,
        lineGap, revealStart, motif: (d.index || 0) % 4, handle: d.handle || '' };
  window.TOTAL = total;
  return { total, events };
};

function bg(t) {
  const g = X.createRadialGradient(W/2, H*0.45, 50, W/2, H*0.45, H*0.8);
  g.addColorStop(0, '#3a1220'); g.addColorStop(0.55, '#1e0910'); g.addColorStop(1, '#0d0407');
  X.fillStyle = g; X.fillRect(0, 0, W, H);
  for (const s of STARS) {
    X.globalAlpha = 0.2 + 0.35 * (0.5 + 0.5*Math.sin(t*s.sp + s.ph));
    let y = (s.y - t*6) % H; if (y < 0) y += H;
    X.fillStyle = '#f6dfe4'; X.beginPath(); X.arc(s.x, y, s.r, 0, 7); X.fill();
  }
  X.globalAlpha = 1;
}
function dot(x, y, r, c, a=1) { r = Math.max(0.1, r); X.save(); X.globalAlpha *= a; glow(c, 30); X.fillStyle = c; X.beginPath(); X.arc(x, y, r, 0, 7); X.fill(); X.restore(); }
function orb(x, y, r, c, a=1) { r = Math.max(0.1, r); X.save(); X.globalAlpha *= a;
  const g = X.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, '#fff'); g.addColorStop(0.25, c); g.addColorStop(1, c + '00');
  glow(c, 50); X.fillStyle = g; X.beginPath(); X.arc(x, y, r, 0, 7); X.fill(); X.restore(); }
function ring(x, y, r, c, a=1, lw=3) { r = Math.max(0.1, r); X.save(); X.globalAlpha *= a; glow(c, 26); X.strokeStyle = c; X.lineWidth = lw; X.beginPath(); X.arc(x, y, r, 0, 7); X.stroke(); X.restore(); }

// word-by-word reveal with highlight words in gold
function drawLines(lines, font, size, y0, startT, gap, t, a, baseColor, hl=true) {
  X.save(); X.font = font; X.textBaseline = 'middle'; X.textAlign = 'left';
  const lh = size * 1.32, top = y0 - (lines.length - 1) * lh / 2;
  lines.forEach((line, i) => {
    const words = line.split(' '), total = X.measureText(line).width, space = X.measureText(' ').width;
    let x = W/2 - total/2;
    words.forEach((w, j) => {
      const k = ease((t - startT - i*gap - j*0.06) / 0.35);
      const isHl = hl && HIGHLIGHT.test(w.replace(/[^\w#'-]/g, ''));
      const col = isHl ? GOLD : baseColor;
      X.globalAlpha = a * k; glow(col, isHl ? 28 : 14); X.fillStyle = col;
      X.fillText(w, x, top + i*lh + (1 - k) * 18);
      x += X.measureText(w).width + space;
    });
  });
  X.restore();
}

function motif(t, a) {
  const cy = 1430, m = S.motif;
  if (m === 0) { // two orbs meet, merge, pulse — loops every 4s
    const p = (t % 4) / 4, gap = lerp(300, 40, ease(p / 0.6));
    if (p > 0.55) { const q = (p - 0.55) / 0.45; ring(W/2, cy, 120 + 220*q, GOLD, a * (1 - q)); }
    orb(W/2 - gap, cy, 110, GOLD, a); orb(W/2 + gap, cy, 110, PINK, a);
  } else if (m === 1) { // arc with travelling dot
    const R = 330, p = (t % 4.5) / 4.5;
    X.save(); X.globalAlpha = a*0.3; X.strokeStyle = PINK; X.lineWidth = 2; X.setLineDash([6, 14]);
    X.beginPath(); X.arc(W/2, cy + 150, R, Math.PI, 0); X.stroke(); X.restore();
    X.save(); X.globalAlpha = a; glow(GOLD, 24); X.strokeStyle = GOLD; X.lineWidth = 5; X.lineCap = 'round';
    X.beginPath(); X.arc(W/2, cy + 150, R, Math.PI, Math.PI + Math.PI*ease(p)); X.stroke(); X.restore();
    const ang = Math.PI + Math.PI*ease(p); dot(W/2 + R*Math.cos(ang), cy + 150 + R*Math.sin(ang), 16, GOLD, a);
  } else if (m === 2) { // heartbeat rings
    const beat = t % 1.6, k = beat < 0.15 ? beat/0.15 : beat < 0.3 ? 1 - (beat-0.15)/0.15*0.5 : beat < 0.45 ? 0.5 + (beat-0.3)/0.15*0.5 : Math.max(0, 1 - (beat-0.45)/1.0);
    orb(W/2, cy, 90 + 40*k, GOLD, a);
    for (let i = 0; i < 3; i++) { const q = ((t + i*0.53) % 1.6) / 1.6; ring(W/2, cy, 120 + 260*q, i % 2 ? PINK : GOLD, a * (1 - q) * 0.8); }
  } else { // two constellations linking up
    const pts = [[-300,-60],[-210,40],[-330,110],[-140,-20],[300,-40],[210,60],[330,120],[140,10]];
    const p = clamp((t % 5) / 3.5);
    X.save(); X.globalAlpha = a*0.6; glow(GOLD, 14); X.strokeStyle = GOLD; X.lineWidth = 2;
    const links = [[0,1],[1,2],[1,3],[4,5],[5,6],[5,7],[3,7]];
    links.forEach(([i,j], n) => { const q = clamp(p*links.length - n); if (q <= 0) return;
      const [x1,y1] = pts[i], [x2,y2] = pts[j]; X.beginPath(); X.moveTo(W/2+x1, cy+y1); X.lineTo(W/2+lerp(x1,x2,q), cy+lerp(y1,y2,q)); X.stroke(); });
    X.restore();
    pts.forEach(([x,y], i) => dot(W/2 + x, cy + y, 9 + 3*Math.sin(t*3 + i), i < 4 ? GOLD : PINK, a));
  }
}

window.render = function (t) {
  bg(t);
  const hookA = Math.min(clamp(t / 0.3), clamp((S.hookEnd - t) / 0.5) + (t < S.hookEnd ? 0 : 0));
  if (t < S.hookEnd + 0.05) drawLines(S.hookLines, S.hookFont, S.hs, 720, S.revealStart, S.lineGap, t, hookA, PINK);
  motif(t, clamp(t / 0.8) * (t < S.hookEnd ? 1 : 0.55));
  if (t >= S.payStart - 0.01) {
    const pa = clamp((t - S.payStart) / 0.4);
    drawLines(S.payLines, S.payFont, S.ps, 760, S.payStart, 0.18, t, pa, GOLD, false);
    // bouncing arrow pointing to the caption
    const ay = 760 + S.payLines.length * S.ps * 0.66 + 70 + 16 * Math.abs(Math.sin((t - S.payStart) * 3.3));
    X.save(); X.globalAlpha = clamp((t - S.payStart - 0.5) / 0.4); glow(GOLD, 22); X.strokeStyle = GOLD; X.lineWidth = 5; X.lineCap = 'round';
    X.beginPath(); X.moveTo(W/2, ay); X.lineTo(W/2, ay + 80); X.moveTo(W/2 - 30, ay + 50); X.lineTo(W/2, ay + 80); X.lineTo(W/2 + 30, ay + 50); X.stroke(); X.restore();
  }
  if (S.handle) { X.save(); X.globalAlpha = 0.55; X.font = `600 28px ${SANS}`; X.letterSpacing = '4px'; X.textAlign = 'center';
    X.fillStyle = PINK; X.fillText(S.handle, W/2, H - 170); X.restore(); }
};
</script></body></html>
